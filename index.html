<body ontouchstart="">
    <style>
      body {
        background-color: #000000;
        margin: 0;
      }
      .initial-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(0, 229, 255, 0.1);
        border-top-color: #00e5ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
      }
    </style>
    <div id="root">
      <div id="initial-loader">
        <div style="text-align: center; max-width: 400px; padding: 30px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
            <h1 style="color:#00e5ff; margin-bottom: 10px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">LogBook</h1>
