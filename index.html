    <!-- Open Graph / Link Preview Tags -->

    <meta property="og:description" content="Traccia i tuoi allenamenti, l'alimentazione e i progressi corporei con LogBook.">

    <!-- Twitter Card Data -->
    <meta name="twitter:card" content="summary">

    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png">

</head>
<body ontouchstart="">
    <style>
      html, body {
        background: #000000;
      }
      body {
        margin: 0;
      }
      #initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        box-sizing: border-box;
        color: #f7f8fa;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .initial-loader-panel {
        width: min(84vw, 320px);
        text-align: center;
      }
      .initial-loader-title {
        margin: 0 0 18px;
        color: #f7f8fa;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.05em;
      }
      .initial-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 18px;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #00e5ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .initial-loader-copy {
        margin: 0;
        color: #9ba3af;
        font-size: 0.9rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-spinner { animation-duration: 1.6s; }
      }
    </style>
    <div id="root">
      <div id="initial-loader">
        <div class="initial-loader-panel">
            <h1 class="initial-loader-title">LogBook</h1>
            <div class="initial-spinner" aria-hidden="true"></div>
            <p class="initial-loader-copy">Caricamento...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
