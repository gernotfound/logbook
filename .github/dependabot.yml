version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Vitest and its reporters must be reviewed at the same resolved version.
      vitest-toolchain:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # CodeQL init/analyze share an upstream SHA and must advance atomically.
      codeql-actions:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"
