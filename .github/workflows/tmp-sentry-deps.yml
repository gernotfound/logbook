name: Temporary Sentry dependency lock

on:
  push:
    branches:
      - feat/sentry-error-monitoring

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sentry-error-monitoring
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --save @sentry/react
      - run: npm install --save-dev @sentry/vite-plugin
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Aggiungi dipendenze Sentry"
          git push origin HEAD:feat/sentry-error-monitoring
