name: Generate Functions Lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate Functions lockfile
        run: npm install --prefix functions --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: functions-package-lock-${{ github.event.pull_request.head.sha }}
          path: functions/package-lock.json
          if-no-files-found: error
          retention-days: 1
