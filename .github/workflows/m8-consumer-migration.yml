name: M8 Consumer Migration Temporary

on:
  push:
    branches:
      - feat/m8-domain-operations-v4
    paths:
      - .github/workflows/m8-consumer-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m8-domain-operations-v4
          fetch-depth: 0
      - name: Allow the known duplicate dependency replacement
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/m8-consumer-migration.mjs')
          text = path.read_text()
          old = """  if (count !== 1) throw new Error(`${path}: expected exactly one match, found ${count}`);\n  fs.writeFileSync(path, source.replace(from, to), 'utf8');"""
          new = """  const duplicateDependency = path === 'src/hooks/useWorkoutSession.ts' && from.includes('[showConfirm, saveUserData, setLocalWorkout, showAlert]');\n  if (count === 0 && duplicateDependency) return;\n  if (count !== 1 && !(duplicateDependency && count === 2)) throw new Error(`${path}: expected exact migration match, found ${count}`);\n  const output = count === 2 ? source.split(from).join(to) : source.replace(from, to);\n  fs.writeFileSync(path, output, 'utf8');"""
          if old not in text:
              raise SystemExit('migration helper contract not found')
          path.write_text(text.replace(old, new))
      - name: Apply migration
        run: node scripts/m8-consumer-migration.mjs
      - name: Commit migrated consumers and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/m8-consumer-migration.mjs .github/workflows/m8-consumer-migration.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M8: migrate complex consumers to domain operations"
          git push origin HEAD:feat/m8-domain-operations-v4
