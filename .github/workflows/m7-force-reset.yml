name: M7 Explicit Logout Reset Patch

on:
  push:
    branches:
      - feat/m7-server-account-deletion
    paths:
      - .github/workflows/m7-force-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: node scripts/tmp-m7-force-reset.mjs
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/slices/createSyncSlice.ts src/contexts/AuthContext.tsx
          git rm scripts/tmp-m7-force-reset.mjs .github/workflows/m7-force-reset.yml
          git commit -m "fix(m7): force-clear explicitly purged logout views"
          git push origin HEAD:feat/m7-server-account-deletion
