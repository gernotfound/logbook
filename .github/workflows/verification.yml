name: Milestone Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shards:
    name: "Verification / ${{ matrix.label }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core
            label: Static, isolated and recovery
            command: "npm audit --audit-level=high && npm run lint && npm run test:typecheck:m5 && npm run test:quality:m5 && npm run test:repo-hygiene && npm run test:ci-contract && npm run test:no-skips && npm run test:isolated && npm run test:fuzz && npm run test:recovery && npm run test:gc"
            java: false
            playwright: false
          - id: unit-1
            label: Unit and integration 1/2
            command: "npm run test -- --shard=1/2"
            java: false
            playwright: false
          - id: unit-2
            label: Unit and integration 2/2
            command: "npm run test -- --shard=2/2"
            java: false
            playwright: false
          - id: hardening-stress
            label: Hardening and stress
            command: "npm run test:hardening && npm run test:stress"
            java: false
            playwright: false
          - id: rules
            label: Firestore Rules
            command: "npm run test:rules"
            java: true
            playwright: false
          - id: e2e
            label: Playwright E2E
            command: "npm run test:e2e"
            java: false
            playwright: true
          - id: m7-m8
            label: Build and M7-M8
            command: "npm run build && npm run test:typecheck:m7 && npm run test:m7 && npm run test:pwa:m7 && npm run test:smoke:m7 && npm run test:m8 && npm run test:domain-boundary:m8"
            java: false
            playwright: false
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual_sha}"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Exact-head verification failed" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java for Firebase Emulator
        if: matrix.java == true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.playwright == true
        run: npx playwright install --with-deps chromium

      - name: Run verification shard
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.command }} 2>&1 | tee "verification-${{ matrix.id }}.log"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-failure-${{ matrix.id }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            verification-${{ matrix.id }}.log
            playwright-report/
            test-results/
            firestore-debug.log
            firebase-debug.log
            dist/sw.js
            dist/manifest.webmanifest

  codeql:
    name: "Security / CodeQL"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual_sha}"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Exact-head verification failed" >&2
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  canonical:
    name: "Canonical Verification"
    runs-on: ubuntu-24.04
    needs:
      - shards
      - codeql
    if: ${{ always() }}
    steps:
      - name: Require verification and security analysis
        env:
          SHARD_RESULT: ${{ needs.shards.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        shell: bash
        run: |
          echo "Parallel verification result: ${SHARD_RESULT}"
          echo "CodeQL result: ${CODEQL_RESULT}"
          if [ "${SHARD_RESULT}" != "success" ]; then
            echo "At least one verification shard failed or was cancelled" >&2
            exit 1
          fi
          if [ "${CODEQL_RESULT}" != "success" ]; then
            echo "CodeQL security analysis failed or was cancelled" >&2
            exit 1
          fi
