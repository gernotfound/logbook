name: Cloudflare isolated D1 migrations (manual, main-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-isolated-d1-migrations
  cancel-in-progress: false

jobs:
  isolated-d1:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert current main and verified release gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_SHA}"
          success="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verification.yml/runs?event=push&head_sha=${EXPECTED_SHA}&per_page=40" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${EXPECTED_SHA}\" and .event == \"push\" and .conclusion == \"success\")] | length")"
          test "${success}" -gt 0
      - name: Install pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify isolated target and non-destructive migration contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          node --test tests/cloudflare/cf02-isolated-d1-schema.node.mjs
          node scripts/check-cloudflare-api-isolation.mjs
          node scripts/verify-cloudflare-isolated-d1-schema.mjs before
      - name: Confirm current main lease immediately before schema write
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_SHA}"
      - name: Apply only approved migrations to isolated D1 via Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.159.0 d1 migrations apply \
            thelogbook-cf02-eu-isolated-20261113 \
            --remote --config cloudflare/api/wrangler.isolated.jsonc
      - name: Independently verify applied ledger and erasure fences
        run: node scripts/verify-cloudflare-isolated-d1-schema.mjs after
