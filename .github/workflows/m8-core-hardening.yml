name: M8 Core Hardening Temporary

on:
  push:
    branches:
      - feat/m8-domain-operations-v4
    paths:
      - .github/workflows/m8-core-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m8-domain-operations-v4
          fetch-depth: 0
      - name: Apply hardening
        run: node scripts/m8-core-hardening.mjs
      - name: Commit hardening and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f scripts/m8-core-hardening.mjs .github/workflows/m8-core-hardening.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M8: harden domain patch semantics"
          git push origin HEAD:feat/m8-domain-operations-v4
