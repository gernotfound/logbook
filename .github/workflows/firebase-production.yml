name: Firebase Production

on:
  workflow_run:
    workflows:
      - Milestone Verification
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase Production
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      LOGBOOK_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
      LOGBOOK_DEPLOY_ENV: production
      FIREBASE_CLI_VERSION: '15.32.0'

      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
      FIREBASE_FUNCTION_REGION: ${{ vars.FIREBASE_FUNCTION_REGION }}
      LOGBOOK_ALLOWED_ORIGINS: ${{ vars.LOGBOOK_ALLOWED_ORIGINS }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      VITE_PUBLIC_ORIGIN: ${{ vars.VITE_PUBLIC_ORIGIN }}
      VITE_ORIGIN_MIGRATION_SOURCE: ${{ vars.VITE_ORIGIN_MIGRATION_SOURCE }}
      VITE_ORIGIN_MIGRATION_TARGET: ${{ vars.VITE_ORIGIN_MIGRATION_TARGET }}
      VITE_ACCOUNT_DELETION_API_URL: ${{ vars.VITE_ACCOUNT_DELETION_API_URL }}

      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}

      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
      - name: Checkout exact verified SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require verified SHA to still be main HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          echo "Verified SHA: ${EXPECTED_SHA}"
          echo "Checkout SHA: ${actual_sha}"
          echo "Current main: ${main_sha}"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ] || [ "${main_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Refusing stale Firebase Production deployment." >&2
            exit 1
          fi

      - name: Setup Node.js 24 for app tooling
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Validate Firebase Production configuration
        run: npm run test:firebase-deploy-env

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Prepare Firebase deploy config
        run: npm run firebase:prepare-deploy

      - name: Configure Functions runtime parameters
        shell: bash
        run: |
          set -euo pipefail
          cat > functions/.env <<EOF
          LOGBOOK_FUNCTION_REGION=${FIREBASE_FUNCTION_REGION}
          LOGBOOK_ALLOWED_ORIGINS=${LOGBOOK_ALLOWED_ORIGINS}
          EOF

      - name: Setup Node.js 22 for Firebase Functions
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and verify Functions dependencies
        run: |
          npm run functions:install
          npm --prefix functions run typecheck

      - name: Recheck main HEAD before Functions deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "${main_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Refusing stale Functions deployment: main advanced." >&2
            exit 1
          fi

      - name: Deploy Functions first
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "firebase-tools@${FIREBASE_CLI_VERSION}" deploy \
            --non-interactive \
            --project "${FIREBASE_PROJECT_ID}" \
            --config .firebase-deploy.json \
            --only functions:accountDeletion,functions:accountDeletionMaintenance

      - name: Recheck main HEAD after Functions deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "${main_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Functions are backward-compatible, but main advanced; refusing stale Hosting publication." >&2
            exit 1
          fi

      - name: Setup Node.js 24 for Production app build
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Build exact Production artifact
        run: npm run build

      - name: Recheck main HEAD immediately before Hosting deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "${main_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Refusing stale Firebase Hosting deployment: main advanced during build." >&2
            exit 1
          fi

      - name: Deploy Hosting second
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "firebase-tools@${FIREBASE_CLI_VERSION}" deploy \
            --non-interactive \
            --project "${FIREBASE_PROJECT_ID}" \
            --config .firebase-deploy.json \
            --only hosting

      - name: Detect main drift after deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "${main_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Firebase deployment completed, but main advanced during publication; the newer main workflow must supersede it." >&2
            exit 1
          fi
