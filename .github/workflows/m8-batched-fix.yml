name: M8 Batched Fix Temporary

on:
  push:
    branches:
      - feat/m8-domain-operations-v4
    paths:
      - .github/workflows/m8-batched-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m8-domain-operations-v4
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Apply deterministic M8 fixes
        run: python3 scripts/m8-batched-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck migrated consumers
        run: npm run test:typecheck:m5
      - name: Run targeted M8 tests
        run: npm run test:m8 && npm run test:domain-boundary:m8
      - name: Commit batched fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m8-batched-fix.yml scripts/m8-batched-fix.py
          git add src/components/Nutrition/NutritionMeals.tsx src/lib/sync/domainOperations.ts tests/m8_domain_operations.test.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M8: fix Domain Operations type boundaries"
          git push origin HEAD:feat/m8-domain-operations-v4
