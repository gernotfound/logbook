name: M8 Documentation Migration Temporary

on:
  push:
    branches:
      - feat/m8-domain-operations-v4
    paths:
      - .github/workflows/m8-doc-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m8-domain-operations-v4
          fetch-depth: 0
      - name: Apply documentation migration
        run: node scripts/m8-doc-migration.mjs
      - name: Commit documentation and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f scripts/m8-doc-migration.mjs .github/workflows/m8-doc-migration.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M8: document Domain Operations storage path"
          git push origin HEAD:feat/m8-domain-operations-v4
