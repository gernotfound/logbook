name: CF-00 Temporary Remote KDF Feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/cf00/**'
      - 'tests/cloudflare/cf00-temporary-remote.mjs'
      - '.github/workflows/cf00-temporary-remote.yml'

permissions:
  contents: read

concurrency:
  group: cf00-temporary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remote-kdf:
    name: Temporary Cloudflare account (KDF only, no Production credentials)
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'CF-00-cloudflare-temporary-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Exercise ephemeral Cloudflare Worker and Durable Object
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: node tests/cloudflare/cf00-temporary-remote.mjs
