name: M7 Lockfile Refresh

on:
  push:
    branches:
      - feat/m7-server-account-deletion
    paths:
      - package.json
      - .github/workflows/m7-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/m7-lockfile-refresh.yml
          git commit -m "build(m7): refresh package lock for firebase admin runtime"
          git push origin HEAD:feat/m7-server-account-deletion
