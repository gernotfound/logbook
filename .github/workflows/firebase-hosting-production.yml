name: Firebase Hosting Production

on:
  workflow_run:
    workflows:
      - Milestone Verification
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact main SHA
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      LOGBOOK_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
      FIREBASE_HOSTING_DEPLOY: production
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_ACCOUNT_DELETION_API_ORIGIN: ${{ vars.VITE_ACCOUNT_DELETION_API_ORIGIN }}
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
      - name: Checkout exact verified main SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          git fetch origin main --depth=1
          current_main="$(git rev-parse origin/main)"
          echo "Verified workflow SHA: ${EXPECTED_SHA}"
          echo "Checkout SHA:          ${actual_sha}"
          echo "Current origin/main:    ${current_main}"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ] || [ "${current_main}" != "${EXPECTED_SHA}" ]; then
            echo "Refusing to deploy a stale or mismatched main SHA" >&2
            exit 1
          fi

      - name: Require production build configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_MEASUREMENT_ID
            VITE_ACCOUNT_DELETION_API_ORIGIN
            VITE_RECAPTCHA_ENTERPRISE_SITE_KEY
            VITE_SENTRY_DSN
            SENTRY_AUTH_TOKEN
            SENTRY_ORG
            SENTRY_PROJECT
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("${name}"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing Firebase Hosting production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [ "${VITE_ACCOUNT_DELETION_API_ORIGIN}" != "https://logbook-gnf.vercel.app" ]; then
            echo "Unexpected trusted backend origin" >&2
            exit 1
          fi
          if [ "${VITE_FIREBASE_AUTH_DOMAIN}" != "thelogbook.web.app" ]; then
            echo "Production Firebase Auth must use the Firebase Hosting origin as authDomain" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: npm ci

      - name: Build exact production frontend
        run: npm run build

      - name: Deploy Firebase Hosting only
        run: npx --yes firebase-tools@15.30.2 deploy --only hosting --project "${VITE_FIREBASE_PROJECT_ID}" --non-interactive -m "GitHub ${EXPECTED_SHA}"

      - name: Verify public Hosting shell and service-worker cache policy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors -D /tmp/thelogbook-index-headers.txt https://thelogbook.web.app/ -o /tmp/thelogbook-index.html
          grep -F 'rel="canonical" href="https://thelogbook.web.app/"' /tmp/thelogbook-index.html
          grep -iE '^cache-control: .*no-cache.*no-store.*must-revalidate' /tmp/thelogbook-index-headers.txt
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors -D /tmp/thelogbook-sw-headers.txt -o /tmp/thelogbook-sw.js https://thelogbook.web.app/sw.js
          grep -iE '^cache-control: .*no-cache.*no-store.*must-revalidate' /tmp/thelogbook-sw-headers.txt
