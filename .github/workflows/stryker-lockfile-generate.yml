name: Temporary Stryker lockfile generation

on:
  push:
    branches:
      - experiment/stryker-vitest-20261106
    paths:
      - .github/workflows/stryker-lockfile-generate.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Generate tracked npm lockfile for reviewed Stryker versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(npm --version)" == 11.* ]]
          npm ci
          npm install --package-lock-only --save-exact --save-dev --ignore-scripts --no-audit --no-fund \
            @stryker-mutator/core@10.1.1 @stryker-mutator/vitest-runner@10.1.1
          node scripts/check-install-scripts.mjs
          npm audit --audit-level=high
      - name: Emit public dependency manifests to log for reviewed GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const name of ['package.json', 'package-lock.json']) {
            const body = readFileSync(name, 'utf8');
            JSON.parse(body);
            const size = 3000;
            const count = Math.ceil(body.length / size);
            console.log('LOCKMETA|' + name + '|' + count + '|' + createHash('sha256').update(body).digest('hex'));
            for (let i = 0; i < count; i++) {
              const chunk = body.slice(i * size, (i + 1) * size);
              console.log('LOCKDATA|' + name + '|' + i + '|' + count + '|' + JSON.stringify(chunk));
            }
          }
          NODE
