name: Cloudflare Kinde HTTP Worker (private, main-only)

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Exact current main and trusted completed push gate are verified before provider access.
    workflows:
      - Milestone Verification
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-isolated-api
  queue: max

jobs:
  private-kinde-http:
    name: Compile, deploy and attest Kinde HTTP Worker without public route
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.ref == 'refs/heads/main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify lease on exact current main (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_SHA}"
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify completed exact-main release and decide deployment relevance
        id: relevance
        env:
          GATE_RUN_ID: ${{ github.event.workflow_run.id }}
          GATE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          required="$(node scripts/cloudflare-private-deploy-plan.mjs .github/workflows/cloudflare-kinde-private.yml)"
          [[ "${required}" == true || "${required}" == false ]]
          echo "required=${required}" >> "$GITHUB_OUTPUT"
      - name: Test private configuration and provider verifier
        if: steps.relevance.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-install-scripts.mjs
          node scripts/check-cloudflare-api-isolation.mjs
          node --test tests/cloudflare/cf02-api-isolation.node.mjs tests/cloudflare/cf03-kinde-private-provider.node.mjs
          npm ci
          node --test tests/cloudflare/cf03-kinde-http-worker.node.mjs
      - name: Bundle Kinde HTTP Worker without publishing
        if: steps.relevance.outputs.required == 'true'
        run: |
          set -euo pipefail
          npx --yes wrangler@4.159.0 deploy --dry-run --config cloudflare/auth/wrangler.kinde.isolated.jsonc
      - name: Read back complete private OAuth bindings before deployment
        if: steps.relevance.outputs.required == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-cloudflare-kinde-private-provider.mjs --require-configured-oauth
      - name: Confirm exact-main lease immediately before provider write
        if: steps.relevance.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_SHA}"
      - name: Deploy only the unrouted Kinde HTTP Worker
        if: steps.relevance.outputs.required == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.159.0'
          command: deploy --config cloudflare/auth/wrangler.kinde.isolated.jsonc
      - name: Verify live Kinde Worker D1, authorization binding and no public URLs
        if: steps.relevance.outputs.required == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-cloudflare-kinde-private-provider.mjs --require-configured-oauth
