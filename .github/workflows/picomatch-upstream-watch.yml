name: Monitor official picomatch security release

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picomatch-upstream-security-monitor
  cancel-in-progress: false

jobs:
  upstream:
    if: github.repository == 'gernotfound/logbook' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pinned Node major
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Check official GHSA and npm release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-picomatch-upstream.mjs
