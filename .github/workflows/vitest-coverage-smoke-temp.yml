# TEMPORARY diagnostic: remove before final candidate validation/merge.
name: Temporary Vitest 5 coverage smoke
on:
  push:
    branches:
      - dependabot/npm_and_yarn/vitest/ui-5.0.4
    paths:
      - .github/workflows/vitest-coverage-smoke-temp.yml
permissions:
  contents: read
jobs:
  coverage-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify install-time scripts before dependencies
        run: node scripts/check-install-scripts.mjs
      - name: Install lockfile packages
        run: npm ci --no-audit --no-fund
      - name: Verify Vitest 5 coverage provider
        run: npm run test:coverage
