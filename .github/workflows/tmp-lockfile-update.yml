name: Temporary Lockfile Update

on:
  push:
    branches:
      - improve/audit-2026-09-18

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: improve/audit-2026-09-18

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate Firebase lockfile
        run: npm install 'firebase@^12.19.0' --package-lock-only --ignore-scripts

      - name: Verify resolved Firebase
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (p.dependencies.firebase !== '^12.19.0') process.exit(1); if (l.packages['node_modules/firebase'].version !== '12.19.0') process.exit(1); console.log('firebase', l.packages['node_modules/firebase'].version)"

      - name: Commit regenerated manifests when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Manifests already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): update Firebase to 12.19.0"
          git push origin HEAD:improve/audit-2026-09-18

      - name: Upload regenerated manifests
        uses: actions/upload-artifact@v7
        with:
          name: firebase-12.19-lockfile
          retention-days: 1
          path: |
            package.json
            package-lock.json
