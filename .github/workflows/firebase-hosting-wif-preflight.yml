name: TEMP Firebase Hosting WIF Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/firebase-hosting-wif-preflight.yml'

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Read-only WIF / Hosting access
    if: >-
      github.event.pull_request.number == 191 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require WIF configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT VITE_FIREBASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing preflight configuration: ${name}" >&2
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.VITE_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify read-only Firebase Hosting access
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.30.2 hosting:sites:get thelogbook             --project "${VITE_FIREBASE_PROJECT_ID}"             --non-interactive | tee /tmp/firebase-hosting-site.txt
          grep -F "thelogbook" /tmp/firebase-hosting-site.txt
