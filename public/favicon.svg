<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-label="LogBook LB neon icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#070b18"/>
      <stop offset="1" stop-color="#09081c"/>
    </linearGradient>
    <radialGradient id="cyanWash" cx="0.14" cy="0.08" r="0.76">
      <stop offset="0" stop-color="#00d7ff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#006cff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetWash" cx="0.90" cy="0.86" r="0.58">
      <stop offset="0" stop-color="#6e00ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameStroke" x1="95" y1="90" x2="1185" y2="1160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16efff"/>
      <stop offset="0.45" stop-color="#0079ff"/>
      <stop offset="1" stop-color="#4f36ff"/>
    </linearGradient>
    <linearGradient id="tlStroke" x1="176" y1="530" x2="596" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10e8ff"/>
      <stop offset="0.52" stop-color="#11edff"/>
      <stop offset="1" stop-color="#155cff"/>
    </linearGradient>
    <linearGradient id="brStroke" x1="660" y1="1025" x2="1080" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b12ff"/>
      <stop offset="0.55" stop-color="#c219ff"/>
      <stop offset="1" stop-color="#7c13ff"/>
    </linearGradient>
    <linearGradient id="logoFill" x1="340" y1="350" x2="950" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#edf2ff"/>
    </linearGradient>
    <filter id="frameGlow" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="b1"/>
      <feGaussianBlur stdDeviation="7" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="logoSoft" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dy="1" result="off"/>
      <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.90  0 0 0 0 1  0 0 0 0.20 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="6" y="4" width="1242" height="1242" rx="258" ry="258"/></clipPath>
  </defs>

  <!-- Transparent outside the rounded app tile -->
  <g filter="url(#frameGlow)">
    <rect x="7" y="5" width="1240" height="1240" rx="257" ry="257" fill="url(#bg)" stroke="url(#frameStroke)" stroke-width="3"/>
  </g>
  <g clip-path="url(#panelClip)">
    <rect x="6" y="4" width="1242" height="1242" fill="url(#cyanWash)"/>
    <rect x="6" y="4" width="1242" height="1242" fill="url(#violetWash)"/>
  </g>

  <!-- Top-left neon bracket -->
  <path d="M 184 522 L 184 235 Q 184 184 236 184 L 574 184"
        fill="none" stroke="url(#tlStroke)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.82" filter="url(#neonGlow)"/>
  <path d="M 184 522 L 184 235 Q 184 184 236 184 L 574 184"
        fill="none" stroke="url(#tlStroke)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-right neon bracket -->
  <path d="M 675 1025 L 1015 1025 Q 1079 1025 1079 961 L 1079 684"
        fill="none" stroke="url(#brStroke)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.84" filter="url(#neonGlow)"/>
  <path d="M 675 1025 L 1015 1025 Q 1079 1025 1079 961 L 1079 684"
        fill="none" stroke="url(#brStroke)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

